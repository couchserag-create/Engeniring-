<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeamWork Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Tahoma, Arial, sans-serif;
      padding: 32px;
    }
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 20px;
    }
    .panel {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 18px;
    }
    h2, h3 { margin-top: 0; }
    .project-item {
      padding: 12px;
      border: 1px solid #374151;
      border-radius: 10px;
      margin-top: 12px;
      background: #1f2937;
    }
    .stage-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #273446;
    }
    .status {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #374151;
      color: #f9fafb;
    }
    .event {
      margin-top: 12px;
      padding: 10px 12px;
      background: #0b1220;
      border-right: 4px solid #38bdf8;
      border-radius: 8px;
    }
    .muted { color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="panel">
      <h2>المشاريع</h2>
      <div id="projects"></div>
    </div>

    <div class="panel">
      <h2>تفاصيل المشروع</h2>
      <div id="details" class="muted">اختر مشروعًا…</div>
    </div>
  </div>

  <script>
    const statusMap = {
      "not_started": "لم تبدأ",
      "in_progress": "قيد التنفيذ",
      "completed": "مكتملة",
      "partial": "جزئية",
      "blocked": "متوقفة"
    };

    async function loadProjects() {
      const res = await fetch("/api/projects");
      const data = await res.json();
      const projectsEl = document.getElementById("projects");
      if (!data.length) {
        projectsEl.innerHTML = "<p class='muted'>لا يوجد مشاريع حتى الآن.</p>";
        return;
      }
      projectsEl.innerHTML = data.map(p => `
        <div class="project-item">
          <h3>${p.name}</h3>
          <div class="muted">${p.pipeline_label}</div>
          <div class="muted">آخر تحديث: ${p.updated_at}</div>
          <button onclick="loadProject('${p.project_id}')">السجل والمراحل</button>
        </div>
      `).join("");
    }

    async function loadProject(projectId) {
      const res = await fetch(`/api/projects/${projectId}`);
      const p = await res.json();
      const details = document.getElementById("details");

      const stages = Object.entries(p.stages || {}).map(([id, s]) => `
        <div class="stage-row">
          <div>${s.label}</div>
          <div class="status">${statusMap[s.status] || s.status}</div>
        </div>
      `).join("");

      const history = (p.history || []).slice().reverse().map(e => `
        <div class="event">
          <div><strong>${e.event}</strong></div>
          <div class="muted">${e.note || ""}</div>
          <div class="muted">${e.at}</div>
        </div>
      `).join("");

      details.innerHTML = `
        <h3>${p.name}</h3>
        <div class="muted">${p.pipeline_label}</div>
        <h4>المراحل</h4>
        ${stages}
        <h4>السجل</h4>
        ${history || "<div class='muted'>لا يوجد سجل.</div>"}
      `;
    }

    loadProjects();
  </script>
</body>
</html>
